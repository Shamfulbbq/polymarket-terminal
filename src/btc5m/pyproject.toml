[project]
name = "btc5m"
version = "0.1.0"
description = "TCN model pipeline for Polymarket BTC UP/DN 5-min prediction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0,<1.24.0",
    "onnxscript>=0.1.0",
]

[tool.uv]
python = "3.11"
